<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Ambient Planet Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#03050a" stop-opacity="0" />
    </radialGradient>

    <!-- Planet Sphere Gradient (matching PPT orange-gold planet) -->
    <radialGradient id="planetBody" cx="34%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#fff6cc" />
      <stop offset="28%" stop-color="#fdba74" />
      <stop offset="62%" stop-color="#ea7d31" />
      <stop offset="88%" stop-color="#b84a18" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>

    <!-- Moon Gradient -->
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Ring Cyan-Gold Gradient -->
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ringInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Clip for Sphere Grid -->
    <clipPath id="sphereClip">
      <circle cx="64" cy="64" r="34" />
    </clipPath>

    <!-- Clip for Front Half of Ring (below planet center along tilted axis) -->
    <clipPath id="frontRingClip">
      <rect x="-10" y="62" width="148" height="76" />
    </clipPath>

    <!-- Clip for Back Half of Ring -->
    <clipPath id="backRingClip">
      <rect x="-10" y="-10" width="148" height="75" />
    </clipPath>
  </defs>

  <!-- Soft Space Halo -->
  <circle cx="64" cy="64" r="60" fill="url(#ambientGlow)" />

  <!-- Back Half of Orbital Rings -->
  <g transform="rotate(-22 64 64)" clip-path="url(#backRingClip)">
    <ellipse cx="64" cy="64" rx="54" ry="15.5" stroke="url(#ringOuter)" stroke-width="4.2" opacity="0.88" />
    <ellipse cx="64" cy="64" rx="48" ry="12.5" stroke="url(#ringInner)" stroke-width="3.2" opacity="0.95" />
  </g>

  <!-- Planet Core Sphere -->
  <circle cx="64" cy="64" r="34" fill="url(#planetBody)" />

  <!-- Subtle Wireframe Latitude/Longitude Grid (matching PPT planet + Computer Graphics nod) -->
  <g clip-path="url(#sphereClip)" stroke="#fff7ed" stroke-opacity="0.22" stroke-width="0.9" fill="none">
    <ellipse cx="64" cy="64" rx="34" ry="10" transform="rotate(-14 64 64)" />
    <ellipse cx="64" cy="52" rx="30" ry="7.5" transform="rotate(-14 64 64)" />
    <ellipse cx="64" cy="76" rx="30" ry="7.5" transform="rotate(-14 64 64)" />
    <ellipse cx="64" cy="64" rx="13" ry="34" transform="rotate(-14 64 64)" />
    <ellipse cx="64" cy="64" rx="25" ry="34" transform="rotate(-14 64 64)" />
  </g>

  <!-- Rim Highlight -->
  <circle cx="64" cy="64" r="33.5" stroke="#fef3c7" stroke-opacity="0.35" stroke-width="1" />

  <!-- Front Half of Orbital Rings (crossing over the planet) -->
  <g transform="rotate(-22 64 64)" clip-path="url(#frontRingClip)">
    <ellipse cx="64" cy="64" rx="54" ry="15.5" stroke="url(#ringOuter)" stroke-width="4.4" />
    <ellipse cx="64" cy="64" rx="48" ry="12.5" stroke="url(#ringInner)" stroke-width="3.4" />
  </g>

  <!-- Small Glowing Moon (Top-Right, matching PPT) -->
  <circle cx="101" cy="27" r="7" fill="url(#moonGrad)" />
  <circle cx="101" cy="27" r="9.5" fill="#ffffff" fill-opacity="0.14" />

  <!-- Cyan 4-Point Sparkle Star (Top-Left, matching PPT) -->
  <path d="M27 20 L29.2 26.8 L36 29 L29.2 31.2 L27 38 L24.8 31.2 L18 29 L24.8 26.8 Z" fill="#4fd1f5" />
</svg>
